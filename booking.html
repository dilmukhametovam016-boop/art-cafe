<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Бронирование — Арт-кафе «Философский суп»</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    <img src="23.jpg" alt="Логотип Арт-кафе" class="logo-img">
    <a href="art-cafe.html" class="logo-text">Арт-кафе «Философский суп»</a>
  </div>
  <nav>
    <a href="aboutus.html">О нас</a>
    <a href="gallery.html">Фотогалерея</a>
    <a href="materials.html">Материалы</a>
    <a href="contact.html">Контакты</a>
    <a href="booking.html" class="active">Регистрация</a>
    <a class="btn" href="booking.html">Забронировать столик</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero hero-about" style="background-image: url('24.jpg');">
  <div class="container">
    <h1>Бронирование столика</h1>
    <p>Заполните форму — и мы свяжемся с вами, чтобы подтвердить бронь.</p>
  </div>
</section>

<div class="pink-divider"></div>

<main class="container">

  <section class="booking-section">

    <h2>Форма бронирования</h2>

    <form class="booking-form" action="#" method="post">

      <label>
        Ваше имя
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Телефон
        <input type="tel" name="phone" required>
      </label>

      <div class="form-row">
        <label>
          Дата
          <input type="date" name="date" required>
        </label>

        <label>
          Время
          <input type="time" name="time" required>
        </label>
      </div>

      <label>
        Количество гостей
        <input type="number" name="guests" min="1" max="20" required>
      </label>

      <label>
        Комментарий
        <textarea name="comment" rows="4" placeholder="Пожелания, предпочтения, аллергии..."></textarea>
      </label>

      <button type="submit" class="btn">Отправить заявку</button>

    </form>

  </section>

</main>

<div class="pink-divider"></div>

<footer>
  <div class="container footer-inner">
    <div>© Арт-кафе «Философский суп»</div>
    <div><a href="contact.html">Контакты</a></div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
